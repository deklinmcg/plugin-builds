name: Build Plugin

on:
  push:
    branches:
      - 'plugin/**'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set plugin name
        run: echo "PLUGIN_NAME=$(cat plugin_name.txt)" >> $GITHUB_ENV

      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_DIR=$PWD/JUCE

      - name: Build VST3
        run: cmake --build build --config Release --target ${{ env.PLUGIN_NAME }}_VST3 -- -j2

      - name: Build AU
        run: cmake --build build --config Release --target ${{ env.PLUGIN_NAME }}_AU -- -j2

      - name: Zip artifacts
        run: |
          mkdir -p dist
          cp -r build/plugin/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}_artefacts/Release/VST3/${{ env.PLUGIN_NAME }}.vst3 dist/ 2>/dev/null || true
          cp -r build/plugin/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}_artefacts/Release/AU/${{ env.PLUGIN_NAME }}.component dist/ 2>/dev/null || true
          cd dist && zip -r ../${{ env.PLUGIN_NAME }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: "*.zip"
          retention-days: 30

      - name: Notify WhatsApp via n8n
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RUN_ID="${{ github.run_id }}"
          PLUGIN="${{ env.PLUGIN_NAME }}"
          NL=$'\n'
          if [ "$STATUS" = "success" ]; then
            MSG="✅ *${PLUGIN}* built successfully${NL}Run ID: ${RUN_ID}${NL}Install: ~/install-plugin.sh ${RUN_ID}"
          else
            MSG="❌ *${PLUGIN}* build failed${NL}Check: https://github.com/deklinmcg/plugin-builds/actions/runs/${RUN_ID}"
          fi
          BODY=$(jq -n --arg type "build_result" --arg plugin "$PLUGIN" --arg status "$STATUS" --arg run_id "$RUN_ID" --arg message "$MSG" \
            '{type:$type,plugin:$plugin,status:$status,run_id:$run_id,message:$message}')
          curl -s -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$BODY" || true
